# Local development/testing docker-compose
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  fart-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fart-dashboard
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3005
      - NITRO_PORT=3005
      - DATA_DIR=/app/data
    volumes:
      - fart-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fart-data:
    driver: local
