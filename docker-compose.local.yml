# Local development/testing docker-compose
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  fart-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fart-dashboard
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3005
      - NITRO_PORT=3005
      - DATA_DIR=/app/data
      # PRINTER_PROXY_URL is injected automatically by dokploy-clone
      # for Docker on Mac to reach local network devices
    volumes:
      - fart-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fart-data:
    driver: local
