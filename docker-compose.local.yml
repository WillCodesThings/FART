# Local development/testing docker-compose
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  fart-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fart-dashboard
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3005
      - NITRO_PORT=3005
      - DATA_DIR=/app/data
    volumes:
      - fart-data:/app/data
    depends_on:
      - mock-printer
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mock-printer:
    build:
      context: ./mock-printer
      dockerfile: Dockerfile
    container_name: mock-printer
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - API_KEY=test-api-key

volumes:
  fart-data:
    driver: local
