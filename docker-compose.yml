# Docker Compose for deployment
# Configure domain and port in dokploy for Traefik routing

services:
  fart-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - fart-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fart-data:
    driver: local
